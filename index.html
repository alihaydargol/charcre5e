<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="D&D 5e (SRD 5.1) kurallarına göre seviye 1-20 karakter oluşturma aracı. Tarayıcıda çalışır, veriler cihazınızda kalır."
    />
    <title>Karakter Oluşturucu — D&D 5e</title>
    <meta name="theme-color" content="#f8f4ea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#16130f" media="(prefers-color-scheme: dark)" />
    <!--
      Stil dosyası inmeden önceki ilk karede de zemin doğru olsun. Aksi hâlde
      tema geçişinde bir anlığına yanlış renk görünür.
    -->
    <style>
      html { background-color: #f8f4ea; color-scheme: light; }
      html[data-theme='dark'] { background-color: #16130f; color-scheme: dark; }
      #app-loading {
        font: 500 14px/1.5 system-ui, sans-serif;
        color: #7d766a;
        padding: 3rem 1rem;
        text-align: center;
      }
    </style>
    <!--
      Temayı ilk boyamadan ÖNCE uygula. React yüklendiğinde uygulansaydı koyu
      tema kullanan kullanıcı önce açık bir ekran görüp sonra karanlığa
      dönerdi — "flash of wrong theme". Bu yüzden satır içi ve senkron.
    -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('charcre5e:theme')
          var dark =
            saved === 'dark' ||
            ((saved === null || saved === 'system') &&
              matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (e) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root">
      <!-- React yüklenene kadar boş ekran yerine bunu gösteririz. -->
      <div id="app-loading">Yükleniyor…</div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
